name: Publish 0.9.1-rc1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create v0.9.1-rc1 GitHub release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v0.9.1-rc1 >/dev/null 2>&1; then
            echo "v0.9.1-rc1 already exists"
            exit 0
          fi
          gh release create v0.9.1-rc1 \
            --title "0.9.1-rc1" \
            --prerelease \
            --notes-file RELEASE-0.9.1-rc1.md
